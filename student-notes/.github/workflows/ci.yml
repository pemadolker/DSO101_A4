name: CI/CD Pipeline — Student Notes API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ── JOB 1: Build & Test ───────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL database as a service container
    # GitHub Actions runs this as a Docker container alongside your VM
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: notes_test
        ports:
          - 5432:5432
        # Wait until Postgres is actually ready before proceeding
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables available to all steps in this job
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/notes_test
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/notes_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ── JOB 2: Deploy (only after tests pass) ─────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "All tests passed. Triggering deployment..."
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST \
            --fail \
            && echo "✅ Deployment triggered successfully!" \
            || echo "❌ Deploy hook call failed."
