# render.yaml — tells Render how to build and run your service
# Commit this to your repo so Render picks it up automatically.

services:
  - type: web
    name: dso-cicd-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true   # Auto-deploys on every push to main (or via deploy hook)
